[project]
name = "backend"
version = "0.1.0"
description = "Review Health Dashboard API"
readme = "README.md"
authors = [
    { name = "Sarthak-Coforge-03", email = "sarthak.kakkar@coforge.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143.0",
    "sqlalchemy>=2.1.4",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=backend"

[tool.coverage.run]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 95
