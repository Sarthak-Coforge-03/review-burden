services:
  api:
    build: ./backend
    environment:
      DATABASE_URL: sqlite:////data/review_health.db
      CORS_ORIGINS: http://localhost:3000
    volumes:
      - db-data:/data
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  web:
    build:
      context: ./frontend/review-burden
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    environment:
      API_URL: http://api:8000
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  db-data:
